---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: http-resolver-
spec:
  pipelineSpec:
    tasks:
      - name: http-resolver
        taskRef:
          resolver: http
          params:
            - name: url
              value: https://raw.githubusercontent.com/tektoncd/catalog/c9818f3dcecde0bc48b88749675eb13f0d314707/task/tkn/0.4/tkn.yaml
        params:
          - name: ARGS
            value: ["version"]
