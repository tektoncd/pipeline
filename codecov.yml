coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default: false

ignore:
  # Entry-point binaries — not unit-testable.
  - "cmd"
  # Auto-generated client code.
  - "pkg/client/"
  # Auto-generated deepcopy/openapi code.
  - "**/zz_generated.deepcopy.go"
  - "**/openapi_generated.go"
  - "**/fake/**"
  - "examples"
  - "hack"
  - "test"
  - "config"
  - "tekton"
  - "docs"
  - "vendor"
